name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Remove names, email addresses, passwords, auth keys and internal hostnames from anything you paste.
  - type: input
    id: version
    attributes:
      label: Image version
      placeholder: "0.6.0"
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Printer model and firmware
      placeholder: "IM C2510, firmware ..."
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: check
    attributes:
      label: Output of `python -m ricoh_ldap_sync.check`
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      render: text
