[project]
name = "ricoh-ldap-sync"
version = "0.5.1"
description = "Keep Ricoh printer address books in sync with an LDAP directory"
requires-python = ">=3.15"
license = "MIT"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:ldap3.*"]
